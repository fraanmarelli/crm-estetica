# Pruebas en cada cambio: tipos, cálculos de plata del formulario y de la base (todas las migraciones
# sobre un Postgres vacío). Si algo falla, GitHub manda un mail y el cambio queda marcado en rojo.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Plata en la app (formulario del turno, Mercado Pago)
        run: npm test
      - name: Plata en la base (migraciones + cobros, comisiones, insumos, monotributo, permisos)
        run: bash supabase/tests/run.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
